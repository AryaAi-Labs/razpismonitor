name: RazpisMonitor Scraper

on:
  schedule:
    - cron: '0 5 * * *'   # vsak dan ob 7:00 CET (5:00 UTC)
  workflow_dispatch:        # omogoči ročni zagon iz GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Network diagnostics
        run: |
          echo "=== curl google ==="
          curl -I --max-time 10 https://google.com || echo "google FAIL"
          echo "=== curl razpismonitor.eu ==="
          curl -I --max-time 10 https://razpismonitor.eu || echo "razpismonitor FAIL"
          echo "=== curl gmail SMTP port 465 ==="
          curl -v --max-time 10 smtps://smtp.gmail.com:465 2>&1 | head -20 || echo "gmail SMTP FAIL"
          echo "=== DNS test ==="
          nslookup razpismonitor.eu || echo "DNS FAIL"

      - name: Run scraper
        env:
          IMPORT_URL: ${{ secrets.IMPORT_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python scripts/scraper.py
