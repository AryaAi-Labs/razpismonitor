name: RazpisMonitor Scraper

on:
  schedule:
    - cron: '0 5 * * *'    # vsak dan ob 7:00 CET (5:00 UTC)
    - cron: '0 12 * * *'   # vsak dan ob 14:00 CET (12:00 UTC)
  workflow_dispatch:        # rocni zagon iz GitHub UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python scripts/scraper.py
