name: RazpisMonitor Scraper

on:
  schedule:
    - cron: '0 5 * * *'   # vsak dan ob 7:00 CET (5:00 UTC)
  workflow_dispatch:        # omogoči ročni zagon iz GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        env:
          IMPORT_URL: ${{ secrets.IMPORT_URL }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
        run: python scripts/scraper.py

